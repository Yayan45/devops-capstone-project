apiVersion: apps/v1
kind: Deployment
metadata:
  name: accounts
spec:
  replicas: 1
  selector:
    matchLabels:
      app: accounts
  template:
    metadata:
      labels:
        app: accounts
    spec:
      containers:
        - name: accounts
          image: accounts:1
          ports:
            - containerPort: 5000
          env:
            - name: DATABASE_URI
              value: "postgres://user:pass@localhost:5432/db"
